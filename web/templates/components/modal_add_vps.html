<!-- Modal: Add Remote VPS Node -->
<div class="modal-overlay" id="modal-add-vps" role="dialog" aria-modal="true" aria-labelledby="modal-add-vps-title">
    <div class="modal-dialog" style="max-width:540px;">
        <form id="form-add-vps" onsubmit="handleProvisionSubmit(event)" style="display:flex;flex-direction:column;max-height:88vh;overflow:hidden;">
            <div class="modal-header" style="padding:16px 20px;">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--bg-orange-soft);color:var(--orange-dark);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-orange);flex-shrink:0;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </div>
                    <div>
                        <h3 class="modal-title" id="modal-add-vps-title" style="font-size:16px;font-weight:700;margin:0;">Add VPS Node</h3>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Connect a Linux server over SSH</div>
                    </div>
                </div>
                <button class="modal-close-btn" type="button" onclick="closeAddVPSModal()" title="Close" aria-label="Close modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body" style="display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;padding:18px 20px;">
                <!-- Row 1: Server IP & Node Name -->
                <div class="modal-grid-2-1" style="display:grid;grid-template-columns: 1.4fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label" for="vps-input-host" style="margin-bottom:5px;font-size:12.5px;">Server IP / Host *</label>
                        <input type="text" id="vps-input-host" class="form-input" placeholder="e.g. 203.0.113.10" required style="padding:8px 12px;font-size:13.5px;">
                    </div>
                    <div>
                        <label class="form-label" for="vps-input-name" style="margin-bottom:5px;font-size:12.5px;">Node Name</label>
                        <input type="text" id="vps-input-name" class="form-input" placeholder="e.g. vps-storage-1" style="padding:8px 12px;font-size:13.5px;">
                    </div>
                </div>

                <!-- Row 2: SSH User, Password, Port -->
                <div class="modal-ssh-add-grid" style="display:grid;grid-template-columns: 1fr 1.5fr 0.7fr;gap:10px;">
                    <div>
                        <label class="form-label" for="vps-input-user" style="margin-bottom:5px;font-size:12.5px;">SSH User *</label>
                        <input type="text" id="vps-input-user" class="form-input" value="root" required oninput="handleUserInputChange(this.value)" style="padding:8px 12px;font-size:13.5px;">
                    </div>
                    <div>
                        <label class="form-label" for="vps-input-password" style="margin-bottom:5px;font-size:12.5px;">SSH Password *</label>
                        <input type="password" id="vps-input-password" class="form-input" placeholder="Server password" required style="padding:8px 12px;font-size:13.5px;">
                    </div>
                    <div>
                        <label class="form-label" for="vps-input-port" style="margin-bottom:5px;font-size:12.5px;">Port</label>
                        <input type="number" id="vps-input-port" class="form-input" value="22" min="1" max="65535" style="padding:8px 10px;font-size:13.5px;">
                    </div>
                </div>

                <!-- Row 3: Coordinator URL & gRPC Target -->
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
                        <label class="form-label" for="vps-input-coordinator-url" style="margin-bottom:0;font-size:12.5px;">Coordinator URL *</label>
                        <span id="coord-reachability-badge" style="font-size:11px;font-weight:600;"></span>
                    </div>
                    <input type="text" id="vps-input-coordinator-url" class="form-input" placeholder="http://host:1212" oninput="checkCoordUrlSafety(this.value)" style="padding:8px 12px;font-size:13.5px;">
                    <div id="coord-warning-box" style="display:none;margin-top:6px;background:var(--bg-orange-soft);border:1px solid var(--border-orange);border-radius:var(--radius-sm);padding:6px 10px;font-size:11.5px;color:var(--orange-dark);line-height:1.35;">
                        ⚠️ Remote VPS cannot dial localhost or private LAN IPs. Provide a public IP or domain.
                    </div>
                    <div style="margin-top:8px;">
                        <label class="form-label" for="vps-input-grpc-target" style="margin-bottom:3px;font-size:11.5px;color:var(--text-secondary);">gRPC Target (Optional, defaults to host:9090)</label>
                        <input type="text" id="vps-input-grpc-target" class="form-input" placeholder="host:9090 (or host:9091 for custom)" style="padding:6px 10px;font-size:12.5px;">
                    </div>
                </div>

                <!-- Sudo Checkbox -->
                <div>
                    <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text-secondary);user-select:none;">
                        <input type="checkbox" id="toggle-use-sudo" style="cursor:pointer;accent-color:var(--orange-primary);">
                        <span>Use sudo elevation (for non-root user)</span>
                    </label>
                </div>

                <!-- Provisioning Progress Log Area -->
                <div id="provision-log-box" style="display:none;background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 14px;font-size:12px;max-height:150px;overflow-y:auto;line-height:1.55;color:var(--text-primary);">
                    <div id="provision-log-content">Connecting to server...</div>
                </div>
            </div>

            <div class="modal-footer" style="display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--border-light);background:var(--bg-surface);">
                <button type="button" class="btn btn-secondary" onclick="closeAddVPSModal()" style="padding:8px 16px;font-size:13px;">Cancel</button>
                <button type="submit" id="btn-submit-provision" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:7px;padding:8px 18px;font-size:13px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span id="btn-provision-text">Connect &amp; Add Node</span>
                </button>
            </div>
        </form>
    </div>
</div>
