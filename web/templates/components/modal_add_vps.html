<!-- Modal: Add / Provision Remote VPS Node -->
<div class="modal-overlay" id="modal-add-vps">
    <div class="modal-dialog" style="max-width:580px;">
        <form id="form-add-vps" onsubmit="handleProvisionSubmit(event)" style="display:flex;flex-direction:column;max-height:86vh;overflow:hidden;">
            <div class="modal-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:38px;height:38px;border-radius:var(--radius-md);background:var(--bg-orange-soft);color:var(--orange-dark);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-orange);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </div>
                    <div>
                        <h3 class="modal-title" style="font-size:18px;">Add New VPS to Cluster</h3>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">SSH provision · public/VPC IP peering (SeaweedFS-style)</div>
                    </div>
                </div>
                <button class="modal-close-btn" type="button" onclick="closeAddVPSModal()">&times;</button>
            </div>

            <div class="modal-body" style="display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1;padding:22px 24px;">
                <!-- Host & Alias -->
                <div style="display:grid;grid-template-columns: 2fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label">VPS Public / VPC IP *</label>
                        <input type="text" id="vps-input-host" class="form-input" placeholder="e.g. 203.0.113.10" required>
                    </div>
                    <div>
                        <label class="form-label">Node Alias</label>
                        <input type="text" id="vps-input-name" class="form-input" placeholder="e.g. vps-storage-1">
                    </div>
                </div>

                <!-- SSH Credentials -->
                <div style="display:grid;grid-template-columns: 1fr 1fr;gap:12px;">
                    <div>
                        <label class="form-label">SSH User</label>
                        <input type="text" id="vps-input-user" class="form-input" value="root" required oninput="handleUserInputChange(this.value)">
                    </div>
                    <div>
                        <label class="form-label">SSH Password *</label>
                        <input type="password" id="vps-input-password" class="form-input" placeholder="SSH password" required>
                    </div>
                </div>

                <!-- Advanced Options: Port & Sudo Toggles -->
                <div style="background:var(--bg-subtle);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:10px;">
                    <!-- Custom Port Toggle -->
                    <div>
                        <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-primary);">
                            <input type="checkbox" id="toggle-custom-port" style="cursor:pointer;accent-color:var(--orange-primary);" onchange="handleCustomPortToggle()">
                            <span>Custom SSH Port</span>
                            <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(Default is 22)</span>
                        </label>
                        <div id="wrap-custom-port" style="display:none;margin-top:8px;">
                            <input type="number" id="vps-input-port" class="form-input" placeholder="e.g. 2222 or 22022" value="22" min="1" max="65535" style="max-width:180px;">
                        </div>
                    </div>

                    <!-- Sudo Elevation Toggle -->
                    <div style="border-top:1px solid var(--border-light);padding-top:8px;">
                        <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-primary);">
                            <input type="checkbox" id="toggle-use-sudo" style="cursor:pointer;accent-color:var(--orange-primary);">
                            <span>Use Sudo Elevation</span>
                            <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">(Enable for non-root users: ubuntu, debian, etc.)</span>
                        </label>
                    </div>
                </div>

                <!-- Provisioning Progress Log Area -->
                <div id="provision-log-box" style="display:none;background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;max-height:160px;overflow-y:auto;line-height:1.6;color:var(--text-primary);">
                    <div id="provision-log-content">Initializing connection...</div>
                </div>
            </div>

            <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--border-light);background:var(--bg-surface);">
                <button type="button" class="btn btn-secondary" onclick="closeAddVPSModal()">Cancel</button>
                <button type="submit" id="btn-submit-provision" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span id="btn-provision-text">Provision & Join Cluster</span>
                </button>
            </div>
        </form>
    </div>
</div>
