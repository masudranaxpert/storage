<!-- ================= GLOBAL AUTHENTICATION / LOGIN OVERLAY MODAL ================= -->
<div class="modal-overlay {{if .NeedsAuth}}open active auth-modal-required{{end}}" id="modal-auth-overlay" style="z-index: 9999; backdrop-filter: blur(16px); background: rgba(9, 10, 13, 0.75);">
    <div class="modal-dialog auth-card-dialog" style="max-width: 440px; width: 100%; margin: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid var(--border-light); border-radius: var(--radius-lg); background: var(--bg-surface); max-height: 94vh; display: flex; flex-direction: column;">

        <!-- Header with Stream Brand Badge -->
        <div style="padding: 24px 24px 16px 24px; text-align: center; border-bottom: 1px solid var(--border-light); background: var(--bg-surface); flex-shrink: 0;">
            <div style="width: 44px; height: 44px; margin: 0 auto 12px auto; background: linear-gradient(135deg, var(--orange-primary), var(--orange-dark)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #ffffff; box-shadow: 0 4px 16px var(--orange-glow);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <h3 id="auth-modal-title" style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px; color: var(--text-primary); margin: 0 0 4px 0;">Sign in to Stream Mesh</h3>
            <p id="auth-modal-subtitle" style="font-size: 12.5px; color: var(--text-secondary); margin: 0; line-height: 1.4;">Enter your administrator credentials to access the control plane.</p>
        </div>

        <!-- Form Body -->
        <form id="auth-login-form" onsubmit="handleAuthSubmit(event)" style="margin: 0; display: flex; flex-direction: column; overflow-y: auto; max-height: none; flex: 1;">
            <div style="padding: 18px 24px 14px 24px; display: flex; flex-direction: column; gap: 14px; flex: 1;">
                
                <!-- Error Alert Box -->
                <div id="auth-error-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-sm); background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; font-size: 12.5px; font-weight: 600; line-height: 1.4;">
                    <span id="auth-error-text">Invalid username or password.</span>
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">
                    <label class="form-label" for="auth-username" style="font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary);">Username</label>
                    <input type="text" id="auth-username" class="form-input" placeholder="admin" required autocomplete="username" autofocus style="height: 40px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0 12px; font-size: 13.5px; background: var(--bg-body); color: var(--text-primary);">
                </div>

                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">
                    <label class="form-label" for="auth-password" style="font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary);">Password</label>
                    <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="height: 40px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0 12px; font-size: 13.5px; background: var(--bg-body); color: var(--text-primary);">
                </div>

                <!-- Confirm Password Field (Visible only on initial setup) -->
                <div class="form-group" id="auth-confirm-group" style="display: none; flex-direction: column; gap: 5px;">
                    <label class="form-label" for="auth-confirm-password" style="font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary);">Confirm Password</label>
                    <input type="password" id="auth-confirm-password" class="form-input" placeholder="••••••••" autocomplete="new-password" style="height: 40px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0 12px; font-size: 13.5px; background: var(--bg-body); color: var(--text-primary);">
                </div>
            </div>

            <!-- Modal Footer with Action Button -->
            <div style="padding: 14px 24px 20px 24px; border-top: 1px solid var(--border-light); background: var(--bg-surface); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
                <button type="submit" id="btn-auth-submit" class="btn btn-primary" style="width: 100%; height: 42px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--orange-primary), var(--orange-dark)); color: #ffffff; border: none; cursor: pointer; box-shadow: 0 2px 8px var(--orange-glow);">
                    <span id="auth-submit-text">Sign In</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--text-muted);">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Secure BadgerDB Session Token with HttpOnly Cookie</span>
                </div>
            </div>
        </form>
    </div>
</div>
