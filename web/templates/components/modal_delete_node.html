<!-- Modal: Decommission / Remove VPS Node -->
<div class="modal-overlay" id="modal-delete-node" style="display:none;">
    <div class="modal-dialog" style="max-width:540px;">
        <div class="modal-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:38px;height:38px;border-radius:var(--radius-md);background:var(--bg-red-soft, rgba(239, 68, 68, 0.12));color:#dc2626;display:flex;align-items:center;justify-content:center;border:1px solid rgba(239, 68, 68, 0.25);flex-shrink:0;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </div>
                <div>
                    <h3 class="modal-title" style="font-size:17px;margin:0;">Decommission Node</h3>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Safely remove or unregister node from cluster</div>
                </div>
            </div>
            <button class="modal-close-btn" type="button" onclick="closeDeleteNodeModal()">&times;</button>
        </div>

        <div class="modal-body" style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;">
            <!-- Node Information Box -->
            <div style="background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 16px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-size:11.5px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;">Node Target</span>
                    <span id="del-modal-node-id" style="font-weight:700;font-size:13.5px;color:var(--text-primary);font-family:'JetBrains Mono',monospace;">—</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:11.5px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;">IP / Host</span>
                    <span id="del-modal-host" style="font-size:12.5px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;">—</span>
                </div>
                <div id="del-modal-cred-badge-wrap" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-light);display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:11.5px;color:var(--text-secondary);">SSH Status:</span>
                    <span id="del-modal-cred-badge" style="font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:12px;">Checking...</span>
                </div>
            </div>

            <!-- Decommission Mode Radio Cards -->
            <div style="display:flex;flex-direction:column;gap:10px;">
                <label style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border-light);border-radius:var(--radius-md);cursor:pointer;background:var(--bg-card);transition:border-color 0.2s;" id="label-mode-stop">
                    <input type="radio" name="del-node-mode" value="stop_remote" checked onchange="toggleDeleteNodeMode()" style="margin-top:3px;">
                    <div style="flex:1;">
                        <div style="display:flex;align-items:center;justify-content:space-between;">
                            <strong style="font-size:13px;color:var(--text-primary);">Stop &amp; Decommission Remote Agent</strong>
                            <span style="font-size:10.5px;font-weight:600;background:rgba(239,68,68,0.1);color:#dc2626;padding:2px 6px;border-radius:4px;">Full Wipe</span>
                        </div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.4;">
                            Connects to the VPS over SSH, stops and disables <code style="font-size:11px;">stream-agent</code>, and cleans up systemd files so it does not keep running.
                        </div>
                    </div>
                </label>

                <label style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border-light);border-radius:var(--radius-md);cursor:pointer;background:var(--bg-card);transition:border-color 0.2s;" id="label-mode-safe">
                    <input type="radio" name="del-node-mode" value="cluster_only" onchange="toggleDeleteNodeMode()" style="margin-top:3px;">
                    <div style="flex:1;">
                        <div style="display:flex;align-items:center;justify-content:space-between;">
                            <strong style="font-size:13px;color:var(--text-primary);">Remove from Cluster Only (Safe Unregister)</strong>
                            <span style="font-size:10.5px;font-weight:600;background:rgba(37,99,235,0.1);color:#2563eb;padding:2px 6px;border-radius:4px;">Safe</span>
                        </div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.4;">
                            Does <strong>not</strong> touch the remote server. Only purges this node record from Coordinator DB. Use this if the VPS was already destroyed, renamed, or replaced by another active node.
                        </div>
                    </div>
                </label>
            </div>

            <!-- Optional/Manual SSH Credentials (shown when no credentials stored in DB) -->
            <div id="del-modal-manual-ssh-wrap" style="display:none;background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:14px;">
                <div style="font-size:12px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">
                    SSH Authentication Required (Not saved in DB):
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <label class="form-label" style="font-size:11.5px;">SSH User</label>
                        <input type="text" id="del-modal-ssh-user" class="form-input" value="root">
                    </div>
                    <div>
                        <label class="form-label" style="font-size:11.5px;">SSH Password</label>
                        <input type="password" id="del-modal-ssh-pass" class="form-input" placeholder="Root/SSH Password">
                    </div>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="del-modal-error-box" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:var(--radius-md);padding:10px 14px;color:#dc2626;font-size:12.5px;line-height:1.4;">
                <span id="del-modal-error-text">Failed to decommission node.</span>
            </div>

            <!-- Loading State -->
            <div id="del-modal-loading" style="display:none;text-align:center;padding:12px 0;">
                <div style="display:inline-flex;align-items:center;gap:10px;color:var(--text-primary);font-size:13px;font-weight:600;">
                    <svg class="spin-fast" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span id="del-modal-loading-text">Decommissioning remote agent over SSH...</span>
                </div>
            </div>
        </div>

        <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border-light);">
            <button type="button" class="btn btn-secondary" id="del-modal-cancel-btn" onclick="closeDeleteNodeModal()">Cancel</button>
            <button type="button" class="btn" id="del-modal-submit-btn" onclick="executeDecommissionNode()" style="background:#dc2626;color:#ffffff;border:none;display:inline-flex;align-items:center;gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span id="del-modal-submit-text">Confirm Decommission</span>
            </button>
        </div>
    </div>
</div>
