<div class="page-view {{if eq .CurrentPage "nodes"}}active{{end}}" id="view-nodes">
    <!-- View Controls & Filters -->
    <div class="view-controls">
        <div class="filter-group" role="tablist" aria-label="Node status filters">
            <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
                <span>All Nodes</span>
                <span class="filter-count-badge" id="count-filter-all">—</span>
            </button>
            <button class="filter-btn" data-filter="online" role="tab" aria-selected="false">
                <span>Online</span>
                <span class="filter-count-badge online" id="count-filter-online">—</span>
            </button>
            <button class="filter-btn" data-filter="stale" role="tab" aria-selected="false">
                <span>Stale</span>
                <span class="filter-count-badge stale" id="count-filter-stale">—</span>
            </button>
            <button class="filter-btn" data-filter="offline" role="tab" aria-selected="false">
                <span>Offline</span>
                <span class="filter-count-badge offline" id="count-filter-offline">—</span>
            </button>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <!-- Search Bar with Icon -->
            <div class="search-input-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="nodes-search-input" placeholder="Search Node ID, Host or IP..." aria-label="Search nodes">
            </div>
            
            <!-- Grid / List Switcher -->
            <div class="layout-toggle" role="group" aria-label="View layout switcher">
                <button class="layout-btn active" id="btn-layout-grid" title="Grid View" aria-label="Grid layout">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button class="layout-btn" id="btn-layout-list" title="Horizontal List View" aria-label="Horizontal list layout">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Total Node Count Pill -->
            <span class="node-count-pill" id="nodes-total-count">—</span>

            <!-- Primary Add VPS Node Button -->
            <button class="btn-add-node" onclick="openAddVPSModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add VPS Node</span>
            </button>
        </div>
    </div>

    <!-- Nodes Container -->
    <div class="nodes-container grid-view" id="nodes-full-list">
        <div class="node-skeleton-card">
            <div style="display:flex;align-items:center;gap:14px;">
                <div class="skeleton-shimmer" style="width:42px;height:42px;border-radius:12px;flex-shrink:0;"></div>
                <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
                    <div class="skeleton-shimmer skeleton-text" style="width:50%;height:16px;"></div>
                    <div class="skeleton-shimmer skeleton-text" style="width:30%;height:12px;"></div>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px;">
                <div class="skeleton-shimmer" style="height:34px;border-radius:8px;"></div>
                <div class="skeleton-shimmer" style="height:34px;border-radius:8px;"></div>
            </div>
        </div>
        <div class="node-skeleton-card">
            <div style="display:flex;align-items:center;gap:14px;">
                <div class="skeleton-shimmer" style="width:42px;height:42px;border-radius:12px;flex-shrink:0;"></div>
                <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
                    <div class="skeleton-shimmer skeleton-text" style="width:45%;height:16px;"></div>
                    <div class="skeleton-shimmer skeleton-text" style="width:35%;height:12px;"></div>
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px;">
                <div class="skeleton-shimmer" style="height:34px;border-radius:8px;"></div>
                <div class="skeleton-shimmer" style="height:34px;border-radius:8px;"></div>
            </div>
        </div>
    </div>
</div>
