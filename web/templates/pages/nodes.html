<div class="page-view {{if eq .CurrentPage "nodes"}}active{{end}}" id="view-nodes">
    <!-- View Controls & Filters -->
    <div class="view-controls">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">All Nodes</button>
            <button class="filter-btn" data-filter="online">Online</button>
            <button class="filter-btn" data-filter="stale">Stale</button>
            <button class="filter-btn" data-filter="offline">Offline</button>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <!-- Search Bar with Icon -->
            <div class="search-input-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="nodes-search-input" placeholder="Search by Node ID, Host or IP...">
            </div>
            
            <!-- Grid / List Switcher -->
            <div class="layout-toggle">
                <button class="layout-btn active" id="btn-layout-grid" title="Grid View">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button class="layout-btn" id="btn-layout-list" title="Horizontal List View">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Total Node Count Pill -->
            <span class="node-count-pill" id="nodes-total-count">0 Nodes</span>

            <!-- Primary Add VPS Node Button -->
            <button class="btn-add-node" onclick="openAddVPSModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add VPS Node</span>
            </button>
        </div>
    </div>

    <!-- Nodes Container -->
    <div class="nodes-container grid-view" id="nodes-full-list">
        <!-- Injected via JS -->
    </div>
</div>
