<div class="page-view {{if eq .CurrentPage "tiers"}}active{{end}}" id="view-tiers">
    <div class="tiers-page-header">
        <div class="header-info">
            <h3 style="font-size:19px;font-weight:800;letter-spacing:-0.3px;margin-bottom:4px;">Tiered Storage &amp; Processing Workers</h3>
        </div>
    </div>

    <div class="tiers-section-header">
        <div class="tiers-section-title">Storage Tiers</div>
        <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;display:inline-flex;align-items:center;gap:6px;" onclick="addNewTier()">
            <span style="font-size:14px;line-height:1;">+</span> Add Tier
        </button>
    </div>
    <div id="tiers-grid" class="tiers-grid"></div>

    <div class="tiers-section-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="tiers-section-title">Processing VPS Pool</div>
            <span class="node-tag" id="processing-eligible-count" style="font-family:'JetBrains Mono',monospace;">-</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn btn-secondary" style="padding:5px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;" onclick="bulkSetProcessing(true)" title="Enable processing across all cluster nodes">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Enable All</span>
            </button>
            <button class="btn btn-secondary" style="padding:5px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;" onclick="bulkSetProcessing(false)" title="Disable processing across all cluster nodes">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <span>Disable All</span>
            </button>
        </div>
    </div>
    <div id="processing-grid" class="processing-grid"></div>
</div>
