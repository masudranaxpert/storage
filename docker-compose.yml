# Stream Mesh — Distributed Media Cluster & Coordinator
#
# Quickstart (Coordinator):
#   docker compose up -d --build
#   Dashboard: http://localhost:1213

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-coordinator
    command: ["coordinator", "--port=1212", "--grpc-port=9090"]
    ports:
      - "1213:1212"
      - "9090:9090"
    volumes:
      - coord-data:/app/data
    networks:
      - stream-mesh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1212/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  stream-mesh:
    driver: bridge

volumes:
  coord-data:
